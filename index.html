<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국어 우리말 배움터 요약(미션을 완료해야 볼 수 있음)</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            overflow: hidden;
        }

        /* 전체 영역 컨테이너 */
        .main-container {
            position: relative;
            width: 600px;
            height: 600px;
        }

        /* 연결 선(SVG) 레이어 */
        .lines-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        line {
            stroke: black;
            stroke-width: 1.5;
        }

        /* 상자와 프로그레스 바를 포함하는 이동 래퍼 */
        .box-wrapper {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 3;
            transition: transform 0.15s ease-out;
        }

        /* 바운스 애니메이션 전용 그룹 래퍼 (상자+호감도바 동시 이동) */
        .bounce-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        /* 오르락내리락 바운스 애니메이션 (그룹 전체에 적용) */
        .bounce-wrapper.bounce-anim {
            animation: bounceUpDown 0.5s ease-in-out;
        }

        @keyframes bounceUpDown {
            0% { transform: translateY(0); }
            50% { transform: translateY(var(--bounce-offset, -15px)); }
            100% { transform: translateY(0); }
        }

        /* 박스 뒤 순서별 하트 이펙트 */
        .bg-heart {
            position: absolute;
            top: 25px; /* 상자 중앙 좌표 */
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 1;
            pointer-events: none;
            color: #ff3366;
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
            filter: drop-shadow(0 0 8px rgba(255, 51, 102, 0.5));
            user-select: none;
        }

        .bg-heart.show {
            opacity: 0.85;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 사각형 상자 공통 스타일 */
        .box {
            position: relative;
            width: 110px;
            height: 50px;
            border: 2px solid black;
            border-radius: 0;
            background-color: white;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
            z-index: 2;
        }

        .box:hover {
            background-color: #f0f0f0;
        }

        .box:active {
            transform: scale(0.95);
        }

        /* 개별 호감도 바 스타일 */
        .progress-container {
            width: 110px;
            height: 16px;
            border: 1.5px solid black;
            background-color: white;
            position: relative;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2;
        }

        .progress-container.show {
            visibility: visible;
            opacity: 1;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #ff9fb3;
            transition: width 0.3s ease;
        }

        .progress-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            color: black;
        }

        /* 선 중간 표시용 하트 스타일 */
        .heart {
            position: absolute;
            font-size: 24px;
            transform: translate(-50%, -50%);
            z-index: 2;
            visibility: hidden;
            opacity: 0;
            background-color: #f9f9f9;
            padding: 2px 4px;
            user-select: none;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .heart.show {
            visibility: visible;
            opacity: 1;
        }

        /* 3명 모두 100% 도달 시 뜨는 중앙 모달 연출 */
        .final-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: white;
            border: 3px solid black;
            padding: 30px 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            opacity: 0;
            visibility: hidden;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .final-modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .final-heart-icon {
            font-size: 90px;
            color: #ff3366;
            animation: pulse 0.8s infinite alternate ease-in-out;
        }

        .final-text {
            font-size: 24px;
            font-weight: bold;
            color: black;
            margin-top: 15px;
            white-space: nowrap;
        }

        /* 다시 시작 버튼 스타일 */
        .restart-btn {
            margin-top: 20px;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            color: black;
            background-color: white;
            border: 2px solid black;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .restart-btn:hover {
            background-color: #ff9fb3;
            color: white;
            border-color: #ff3366;
        }

        .restart-btn:active {
            transform: scale(0.95);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.18); }
        }
    </style>
</head>
<body>

    <div class="main-container" id="mainContainer">
        <!-- 연결 선이 그려질 SVG 영역 -->
        <svg class="lines-layer" id="svgLayer"></svg>

        <!-- 최종 완성 모달 -->
        <div class="final-modal" id="finalModal">
            <div class="final-heart-icon">❤️</div>
            <div class="final-text" id="finalText"></div>
            <button class="restart-btn" id="restartBtn">🔄 다시 시작</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('mainContainer');
        const svgLayer = document.getElementById('svgLayer');
        const finalModal = document.getElementById('finalModal');
        const finalText = document.getElementById('finalText');
        const restartBtn = document.getElementById('restartBtn');

        // 이름 설정
        const centerName = '이호수';
        const outerNames = ['이가온', '한은제', '이윤서', '박민재', '박민욱'];

        // 상태 관리
        let isCenterClicked = false;
        let arrivalOrder = [];

        // 중심 좌표 및 반지름
        const centerX = 300;
        const centerY = 300;
        const radius = 210;

        // 중앙 상자 생성
        const centerWrapper = document.createElement('div');
        centerWrapper.className = 'box-wrapper movable-target';
        centerWrapper.dataset.baseX = centerX;
        centerWrapper.dataset.baseY = centerY;
        centerWrapper.style.left = `${centerX}px`;
        centerWrapper.style.top = `${centerY}px`;

        const centerBox = document.createElement('div');
        centerBox.className = 'box';
        centerBox.innerHTML = '🖱️ 클릭';
        centerWrapper.appendChild(centerBox);
        container.appendChild(centerWrapper);

        // 중앙 상자 클릭 이벤트
        centerBox.addEventListener('click', () => {
            if (!isCenterClicked) {
                isCenterClicked = true;
                centerBox.innerHTML = centerName;
                updateHearts();
            }
            triggerAllBounceAndAffection();
        });

        // 외곽 상자 데이터 저장 객체 배열
        const items = [];

        // 외곽 5개 상자, 호감도 바, 연결 선, 하트 이펙트 생성
        outerNames.forEach((name, i) => {
            const angleDeg = -90 + (i * 72);
            const angleRad = (angleDeg * Math.PI) / 180;

            const outerX = centerX + radius * Math.cos(angleRad);
            const outerY = centerY + radius * Math.sin(angleRad);

            // SVG 연결 선 생성
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            svgLayer.appendChild(line);

            // 선 중간 하트 생성
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            container.appendChild(heart);

            // Outer Wrapper
            const outerWrapper = document.createElement('div');
            outerWrapper.className = 'box-wrapper movable-target';
            outerWrapper.dataset.baseX = outerX;
            outerWrapper.dataset.baseY = outerY;
            outerWrapper.style.left = `${outerX}px`;
            outerWrapper.style.top = `${outerY}px`;

            // Bounce Wrapper
            const bounceWrapper = document.createElement('div');
            bounceWrapper.className = 'bounce-wrapper';

            // 배경 하트
            const bgHeart = document.createElement('div');
            bgHeart.className = 'bg-heart';
            bgHeart.innerHTML = '❤️';

            // 상자
            const box = document.createElement('div');
            box.className = 'box';
            box.innerHTML = '🖱️ 클릭';

            // 호감도 바
            const progressContainer = document.createElement('div');
            progressContainer.className = 'progress-container';
            const progressBar = document.createElement('div');
            progressBar.className = 'progress-bar';
            const progressText = document.createElement('div');
            progressText.className = 'progress-text';
            progressText.innerText = '0%';

            progressContainer.appendChild(progressBar);
            progressContainer.appendChild(progressText);

            // 계층 구조 결합
            bounceWrapper.appendChild(bgHeart);
            bounceWrapper.appendChild(box);
            bounceWrapper.appendChild(progressContainer);
            outerWrapper.appendChild(bounceWrapper);
            container.appendChild(outerWrapper);

            // 객체 보관
            const itemObj = {
                name,
                isClicked: false,
                affection: 0,
                line,
                heart,
                outerWrapper,
                bounceWrapper,
                bgHeart,
                box,
                progressContainer,
                progressBar,
                progressText
            };

            items.push(itemObj);

            // 외곽 상자 클릭 이벤트
            box.addEventListener('click', () => {
                if (!itemObj.isClicked) {
                    itemObj.isClicked = true;
                    box.innerHTML = name;
                    updateHearts();
                }
            });
        });

        // 특정 인원 호감도 변동 함수
        function applyAffection(item, index) {
            item.progressContainer.classList.add('show');

            if (item.affection < 100) {
                let randomDelta = Math.floor(Math.random() * 16) - 5; // 기본 범위: -5 ~ +10

                // 박민재, 박민욱 전용 70% 억제 규칙
                if (item.name === '박민재' || item.name === '박민욱') {
                    if (item.affection >= 70 || (item.affection + randomDelta >= 70)) {
                        randomDelta = -(Math.floor(Math.random() * 10) + 1); // 무조건 감점
                    }
                }

                item.affection = Math.max(0, Math.min(100, item.affection + randomDelta));

                item.progressBar.style.width = item.affection + '%';
                item.progressText.innerHTML = item.affection >= 100 ? '100% MAX! 💕' : item.affection + '%';

                if (item.affection >= 100 && !arrivalOrder.includes(index)) {
                    arrivalOrder.push(index);
                    const rank = arrivalOrder.length - 1;
                    showBgHeartEffect(item, rank);

                    // 3명 모두 100% 도달 시 레이스 종료
                    if (arrivalOrder.length === 3) {
                        showFinalWinner();
                    }
                }
            }
        }

        // 배경 하트 크기 차등 적용
        function showBgHeartEffect(item, rank) {
            const sizes = ['110px', '85px', '65px'];
            item.bgHeart.style.fontSize = sizes[rank] || '65px';
            item.bgHeart.classList.add('show');
        }

        // 3명 완료 시 최종 모달
        function showFinalWinner() {
            const winnerIndex = arrivalOrder[0];
            const winnerName = items[winnerIndex].name;

            finalText.innerHTML = `${centerName} ❤️ ${winnerName}`;
            setTimeout(() => {
                finalModal.classList.add('show');
            }, 500);
        }

        // 다시 시작 (초기화) 로직
        restartBtn.addEventListener('click', () => {
            isCenterClicked = false;
            arrivalOrder = [];

            // 중앙 상자 초기화
            centerBox.innerHTML = '🖱️ 클릭';

            // 외곽 상자 및 상태 초기화
            items.forEach(item => {
                item.isClicked = false;
                item.affection = 0;
                item.box.innerHTML = '🖱️ 클릭';
                item.progressBar.style.width = '0%';
                item.progressText.innerText = '0%';
                item.progressContainer.classList.remove('show');
                item.bgHeart.classList.remove('show');
                item.heart.classList.remove('show');
            });

            // 모달 닫기
            finalModal.classList.remove('show');
        });

        // 하트 노출 체크
        function updateHearts() {
            items.forEach(item => {
                if (isCenterClicked && item.isClicked) {
                    item.heart.classList.add('show');
                }
            });
        }

        // 바운스 애니메이션 및 호감도 진행
        function triggerAllBounceAndAffection() {
            items.forEach((item, index) => {
                if (isCenterClicked && item.isClicked) {
                    applyAffection(item, index);
                }

                const randomOffset = (Math.random() * 20 + 10) * (Math.random() > 0.5 ? 1 : -1);
                item.bounceWrapper.style.setProperty('--bounce-offset', `${randomOffset}px`);

                item.bounceWrapper.classList.remove('bounce-anim');
                void item.bounceWrapper.offsetWidth; // Reflow
                item.bounceWrapper.classList.add('bounce-anim');
            });
        }

        // 실시간 선 & 중앙 하트 위치 업데이트 루프
        function updateLinesAndHearts() {
            const containerRect = container.getBoundingClientRect();
            const centerRect = centerBox.getBoundingClientRect();

            const cx = centerRect.left + centerRect.width / 2 - containerRect.left;
            const cy = centerRect.top + centerRect.height / 2 - containerRect.top;

            items.forEach(item => {
                const boxRect = item.box.getBoundingClientRect();

                const bx = boxRect.left + boxRect.width / 2 - containerRect.left;
                const by = boxRect.top + boxRect.height / 2 - containerRect.top;

                item.line.setAttribute('x1', cx);
                item.line.setAttribute('y1', cy);
                item.line.setAttribute('x2', bx);
                item.line.setAttribute('y2', by);

                const midX = (cx + bx) / 2;
                const midY = (cy + by) / 2;
                item.heart.style.left = `${midX}px`;
                item.heart.style.top = `${midY}px`;
            });

            requestAnimationFrame(updateLinesAndHearts);
        }

        // 실시간 위치 추적 시작
        requestAnimationFrame(updateLinesAndHearts);

        // 마우스 피하기 효과
        document.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const targets = document.querySelectorAll('.movable-target');

            targets.forEach(target => {
                const baseX = parseFloat(target.dataset.baseX);
                const baseY = parseFloat(target.dataset.baseY);

                const dx = mouseX - baseX;
                const dy = mouseY - baseY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                const threshold = 90;

                if (dist < threshold && dist > 0) {
                    const force = (threshold - dist) / threshold;
                    const moveX = -(dx / dist) * force * 20;
                    const moveY = -(dy / dist) * force * 20;

                    target.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
                } else {
                    target.style.transform = `translate(-50%, -50%)`;
                }
            });
        });
    </script>

</body>
</html>
