<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이호수와 아이들 - 100% 레이스</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            overflow: hidden;
        }

        /* 전체 영역 컨테이너 */
        .main-container {
            position: relative;
            width: 600px;
            height: 600px;
        }

        /* 연결 선(SVG) 레이어 */
        .lines-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 얇은 검은색 연결 선 */
        line {
            stroke: black;
            stroke-width: 1.5;
        }

        /* 상자와 프로그레스 바를 포함하는 래퍼 */
        .box-wrapper {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transform: translate(-50%, -50%);
            z-index: 3;
            transition: transform 0.15s ease-out;
        }

        /* 사각형 상자 공통 스타일 */
        .box {
            position: relative;
            width: 110px;
            height: 50px;
            border: 2px solid black; /* 검은 테두리 */
            border-radius: 0; /* 라운드 없는 직사각형 */
            background-color: white;
            color: black; /* 검은 글씨 */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
            z-index: 2;
        }

        .box:hover {
            background-color: #f0f0f0;
        }

        .box:active {
            transform: scale(0.95);
        }

        /* 박스 뒤에 배치될 순서별 하트 이펙트 */
        .bg-heart {
            position: absolute;
            top: 25px;
            left: 55px;
            transform: translate(-50%, -50%) scale(0);
            z-index: 1; /* 박스 바로 뒤 */
            pointer-events: none;
            color: #ff4d6d;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
            filter: drop-shadow(0 0 6px rgba(255, 77, 109, 0.4));
            user-select: none;
        }

        .bg-heart.show {
            opacity: 0.85;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 개별 호감도 바 스타일 */
        .progress-container {
            width: 110px;
            height: 16px;
            border: 1.5px solid black;
            background-color: white;
            position: relative;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2;
        }

        .progress-container.show {
            visibility: visible;
            opacity: 1;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #ff9fb3;
            transition: width 0.3s ease;
        }

        .progress-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            color: black;
        }

        /* 선 중간 표시용 하트 스타일 */
        .heart {
            position: absolute;
            font-size: 24px;
            transform: translate(-50%, -50%);
            z-index: 2;
            visibility: hidden;
            opacity: 0;
            background-color: #f9f9f9;
            padding: 2px 4px;
            user-select: none;
            transition: opacity 0.3s ease;
        }

        .heart.show {
            visibility: visible;
            opacity: 1;
            animation: popHeart 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popHeart {
            0% { transform: translate(-50%, -50%) scale(0); }
            70% { transform: translate(-50%, -50%) scale(1.3); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* 이호수 클릭 시 통통 튀는 바운스 애니메이션 */
        .bounce-anim {
            animation: bounceUpDown 0.5s ease-in-out;
        }

        @keyframes bounceUpDown {
            0% { margin-top: 0px; }
            50% { margin-top: var(--bounce-offset, -15px); }
            100% { margin-top: 0px; }
        }

        /* 5명 모두 100% 도달 시 뜨는 중앙 모달 */
        .final-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: white;
            border: 3px solid black;
            padding: 25px 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0;
            visibility: hidden;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .final-modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .final-heart-icon {
            font-size: 80px;
            color: #ff3366;
            animation: pulse 1s infinite alternate ease-in-out;
        }

        .final-text {
            font-size: 22px;
            font-weight: bold;
            color: black;
            margin-top: 15px;
            white-space: nowrap;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <div class="main-container" id="mainContainer">
        <!-- 연결 선이 그려질 SVG 영역 -->
        <svg class="lines-layer" id="svgLayer"></svg>

        <!-- 최종 완료 결과 모달 -->
        <div class="final-modal" id="finalModal">
            <div class="final-heart-icon">❤️</div>
            <div class="final-text" id="finalText"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('mainContainer');
        const svgLayer = document.getElementById('svgLayer');
        const finalModal = document.getElementById('finalModal');
        const finalText = document.getElementById('finalText');

        // 이름 설정
        const centerName = '이호수';
        const outerNames = ['이가온', '한은제', '이윤서', '홍길동', '곽김동'];

        // 상태 관리
        let isCenterClicked = false;
        const outerClickedState = [false, false, false, false, false];
        const affectionLevels = [0, 0, 0, 0, 0];
        const arrivalOrder = []; // 100% 도달 순서 기록 배열

        // 중심 좌표 및 반지름
        const centerX = 300;
        const centerY = 300;
        const radius = 210;

        // 1. 중앙 상자 생성
        const centerWrapper = document.createElement('div');
        centerWrapper.className = 'box-wrapper movable-target';
        centerWrapper.dataset.baseX = centerX;
        centerWrapper.dataset.baseY = centerY;
        centerWrapper.style.left = `${centerX}px`;
        centerWrapper.style.top = `${centerY}px`;

        const centerBox = document.createElement('div');
        centerBox.className = 'box';
        centerBox.innerHTML = '🖱️ 클릭';
        centerWrapper.appendChild(centerBox);
        container.appendChild(centerWrapper);

        // 중앙 상자('이호수') 클릭 이벤트
        centerBox.addEventListener('click', () => {
            if (!isCenterClicked) {
                isCenterClicked = true;
                centerBox.innerHTML = centerName;
                updateHearts();
            }

            triggerAllBounceAndAffection();
        });

        // 2. 외곽 5개 상자, 호감도 바, 연결 선, 하트 이펙트 생성
        outerNames.forEach((name, i) => {
            const angleDeg = -90 + (i * 72);
            const angleRad = (angleDeg * Math.PI) / 180;

            const outerX = centerX + radius * Math.cos(angleRad);
            const outerY = centerY + radius * Math.sin(angleRad);

            const midX = centerX + (radius / 2) * Math.cos(angleRad);
            const midY = centerY + (radius / 2) * Math.sin(angleRad);

            // SVG 연결 선 생성
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', centerX);
            line.setAttribute('y1', centerY);
            line.setAttribute('x2', outerX);
            line.setAttribute('y2', outerY);
            svgLayer.appendChild(line);

            // 선 중간 하트 생성 (시각적 표시 전용)
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.id = `heart-${i}`;
            heart.style.left = `${midX}px`;
            heart.style.top = `${midY}px`;
            heart.innerHTML = '❤️';
            container.appendChild(heart);

            // 외곽 상자 래퍼
            const outerWrapper = document.createElement('div');
            outerWrapper.className = 'box-wrapper movable-target';
            outerWrapper.id = `outer-wrapper-${i}`;
            outerWrapper.dataset.baseX = outerX;
            outerWrapper.dataset.baseY = outerY;
            outerWrapper.style.left = `${outerX}px`;
            outerWrapper.style.top = `${outerY}px`;

            const box = document.createElement('div');
            box.className = 'box';
            box.innerHTML = '🖱️ 클릭';

            // 박스 뒤 하트 이펙트 엘리먼트
            const bgHeart = document.createElement('div');
            bgHeart.className = 'bg-heart';
            bgHeart.id = `bg-heart-${i}`;
            bgHeart.innerHTML = '❤️';
            box.appendChild(bgHeart);

            // 호감도 바 HTML 구조
            const progressContainer = document.createElement('div');
            progressContainer.className = 'progress-container';
            progressContainer.id = `progress-container-${i}`;
            progressContainer.innerHTML = `
                <div class="progress-bar" id="progress-bar-${i}"></div>
                <div class="progress-text" id="progress-text-${i}">0%</div>
            `;

            outerWrapper.appendChild(box);
            outerWrapper.appendChild(progressContainer);
            container.appendChild(outerWrapper);

            // 외곽 상자 클릭 이벤트
            box.addEventListener('click', () => {
                if (!outerClickedState[i]) {
                    outerClickedState[i] = true;
                    box.innerHTML = name;
                    updateHearts();
                }
            });
        });

        // 특정 인원 호감도 변동 함수 (-5% ~ +10%, 100% 고정)
        function applyAffection(i) {
            const pContainer = document.getElementById(`progress-container-${i}`);
            const pBar = document.getElementById(`progress-bar-${i}`);
            const pText = document.getElementById(`progress-text-${i}`);

            pContainer.classList.add('show');

            // 이미 100%에 도달한 사람은 호감도가 더 이상 깎이지 않음
            if (affectionLevels[i] < 100) {
                const randomDelta = Math.floor(Math.random() * 16) - 5;
                affectionLevels[i] = Math.max(0, Math.min(100, affectionLevels[i] + randomDelta));

                pBar.style.width = affectionLevels[i] + '%';
                pText.innerHTML = affectionLevels[i] >= 100 ? '100% MAX! 💕' : affectionLevels[i] + '%';

                // 100% 도달 순간 처리
                if (affectionLevels[i] >= 100 && !arrivalOrder.includes(i)) {
                    arrivalOrder.push(i);
                    const rank = arrivalOrder.length - 1; // 0등(1위) ~ 4등(5위)
                    showBgHeartEffect(i, rank);

                    // 5명 모두 100% 도달 시 최종 결과 표시
                    if (arrivalOrder.length === 5) {
                        showFinalWinner();
                    }
                }
            }
        }

        // 도달 순서에 따른 박스 뒤 하트 이펙트 크기 적용
        function showBgHeartEffect(index, rank) {
            const bgHeart = document.getElementById(`bg-heart-${index}`);
            // 1등부터 5등까지 크기 차등 적용 (1등이 가장 큼)
            const sizes = ['110px', '85px', '65px', '50px', '38px'];
            bgHeart.style.fontSize = sizes[rank] || '38px';
            bgHeart.classList.add('show');
        }

        // 5명 모두 100% 도달 시 1등 발표
        function showFinalWinner() {
            const winnerIndex = arrivalOrder[0];
            const winnerName = outerNames[winnerIndex];

            finalText.innerHTML = `이호수 ❤️ ${winnerName}`;
            setTimeout(() => {
                finalModal.classList.add('show');
            }, 400);
        }

        // 하트 노출 체크
        function updateHearts() {
            outerNames.forEach((_, i) => {
                if (isCenterClicked && outerClickedState[i]) {
                    const heart = document.getElementById(`heart-${i}`);
                    heart.classList.add('show');
                }
            });
        }

        // 이호수 클릭 시 실행: 5명 전체 바운스 및 호감도 무작위 변동
        function triggerAllBounceAndAffection() {
            outerNames.forEach((_, i) => {
                const wrapper = document.getElementById(`outer-wrapper-${i}`);

                // 중앙 + 해당 상자 둘 다 눌린 대상만 호감도 진행
                if (isCenterClicked && outerClickedState[i]) {
                    applyAffection(i);
                }

                // 모션 애니메이션
                const randomOffset = (Math.random() * 20 + 10) * (Math.random() > 0.5 ? 1 : -1);
                wrapper.style.setProperty('--bounce-offset', `${randomOffset}px`);

                wrapper.classList.remove('bounce-anim');
                void wrapper.offsetWidth;
                wrapper.classList.add('bounce-anim');
            });
        }

        // 마우스 근접 시 상자가 반응하는 효과
        document.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const targets = document.querySelectorAll('.movable-target');

            targets.forEach(target => {
                const baseX = parseFloat(target.dataset.baseX);
                const baseY = parseFloat(target.dataset.baseY);

                const dx = mouseX - baseX;
                const dy = mouseY - baseY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                const threshold = 90;

                if (dist < threshold && dist > 0) {
                    const force = (threshold - dist) / threshold;
                    const moveX = -(dx / dist) * force * 20;
                    const moveY = -(dy / dist) * force * 20;

                    target.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
                } else {
                    target.style.transform = `translate(-50%, -50%)`;
                }
            });
        });
    </script>

</body>
</html>
